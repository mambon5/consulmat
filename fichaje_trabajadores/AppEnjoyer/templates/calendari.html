{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Calendario Laboral</h3>
                </div>
                <div class="card-body">
                    {% if treballadors %}
                    <div class="mb-3">
                        <form method="get">
                            <label for="treballador_id" class="form-label">Selecciona trabajador:</label>
                            <select name="treballador_id" id="treballador_id" class="form-select" onchange="this.form.submit()">
                                {% for t in treballadors %}
                                    <option value="{{ t.id_treballador }}" {% if t.id_treballador == treballador_seleccionat.id_treballador %}selected{% endif %}>
                                        {{ t.user.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </form>
                    </div>
                     {% endif %}

                     
                    <div class="mb-3">
                    <label class="form-label fw-bold">Tipus d'absència:</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipo_evento" id="radio_vacances" value="vacances" checked>
                        <label class="form-check-label" for="radio_vacances">Vacances</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipo_evento" id="radio_baixa" value="baixa_medica">
                        <label class="form-check-label" for="radio_baixa">Baixa mèdica</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipo_evento" id="radio_assumptes" value="assumptes_propis">
                        <label class="form-check-label" for="radio_assumptes">Assumptes propis</label>
                    </div>
                </div>

                   
                    <div id="calendar"></div>
                    <p class="mt-3 text-muted small">
                        🔹 Fes clic en un dia buit per marcar-lo com a <strong>vacances</strong>.<br>
                        🔹 Fes clic en un dia de vacances per <strong>eliminar-lo</strong>.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- FullCalendar CSS y JS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'es',
        height: 'auto',
        events: {{ eventos|tojson | safe }},
        selectable: true,
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek'
        },

        // Selecció de dies per vacances
       select: async function(info) {
        const tipo_evento = document.querySelector('input[name="tipo_evento"]:checked').value;

        const startInput = prompt(`📅 Introdueix el dia d'inici de ${tipo_evento.replace('_', ' ')} (YYYY-MM-DD):`, info.startStr);
        if (!startInput) return;

        const endInput = prompt(`📅 Introdueix el dia final de ${tipo_evento.replace('_', ' ')} (YYYY-MM-DD):`, info.endStr || info.startStr);
        if (!endInput) return;

        const startDate = new Date(startInput);
        const endDate = new Date(endInput);

        if (isNaN(startDate) || isNaN(endDate)) {
            alert("⚠️ Format de data incorrecte.");
            return;
        }
        if (endDate < startDate) {
            alert("⚠️ La data final no pot ser anterior a la inicial.");
            return;
        }

        const dates = [];
        for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
            dates.push(d.toISOString().split('T')[0]);
        }

        if (!confirm(`Vols marcar ${tipo_evento.replace('_', ' ')} del ${startInput} al ${endInput}?`)) return;

        try {
            for (const date of dates) {
                const res = await fetch('/api/absencia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fecha: date, tipo_evento })
                });
                const data = await res.json();
                if (data.status !== 'ok') {
                    console.error("❌ Error afegint absència:", data.message || data.error);
                    alert(`❌ No s'ha pogut afegir ${date}: ${data.error || data.message}`);
                }
            }
            alert(`✔️ ${tipo_evento.replace('_', ' ')} afegides del ${startInput} al ${endInput}`);
            calendar.refetchEvents();
        } catch (err) {
            console.error("⚠️ Error:", err);
            alert("S'ha produït un error al afegir les absències.");
        }
        },


        // Esborrar vacances fent clic
        eventClick: async function(info) {
            if (info.event.title.toLowerCase().includes('vacances')) {
                if (!confirm(`Vols eliminar les vacances del dia ${info.event.startStr}?`)) return;

                try {
                    const res = await fetch(`/api/vacances/${info.event.id}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.status === 'ok') {
                        info.event.remove();
                        alert("Vacances eliminades correctament");
                    } else {
                        alert("❌ Error: " + data.message);
                    }
                } catch (err) {
                    console.error(err);
                    alert("S'ha produït un error al eliminar vacances.");
                }
            }
        },

        eventDidMount: function(info) {
            if (info.event.title.includes('Festivo')) {
                info.el.style.backgroundColor = '#e53935';
                info.el.style.borderColor = '#e53935';
                info.el.style.color = 'white';
            } else if (info.event.title.includes('Trabajo')) {
                info.el.style.backgroundColor = '#1976d2';
                info.el.style.borderColor = '#1976d2';
                info.el.style.color = 'white';
            } else if (info.event.title.toLowerCase().includes('vacances')) {
                info.el.style.backgroundColor = '#43a047';
                info.el.style.borderColor = '#43a047';
                info.el.style.color = 'white';
            }
        }
    });

    calendar.render();
});
</script>
{% endblock %}
