{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">{{ _('Recuperar Contraseña') }}</h2>
                <p class="text-muted text-center mb-4">{{ _('Introduce tu email o nombre de usuario y te enviaremos un código de seguridad para
                    restablecer tu contraseña.') }}</p>

                <form method="POST">
                    <div class="mb-4">
                        <label for="identifier" class="form-label">{{ _('Email o Usuario') }}</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="text" class="form-control" id="identifier" name="identifier" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send"></i> Enviar Código
                        </button>
                        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary">{{ _('Volver al Inicio') }}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
