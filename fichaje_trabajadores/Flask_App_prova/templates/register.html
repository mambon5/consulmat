<!-- templates/register.html -->
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Treballador</title>
</head>
<body>
    <h1>Registrar Treballador</h1>
    <form method="POST" action="/register">
        <label for="nom">Nom i Cognom:</label>
        <input type="text" id="nom" name="nom" required><br><br>

        <label for="correu">Correu Electrònic:</label>
        <input type="email" id="correu" name="correu" required><br><br>

        <label for="contrasenya">Contrasenya:</label>
        <input type="password" id="contrasenya" name="contrasenya" required><br><br>

        <label for="departament">Departament:</label>
        <select id="departament" name="departament">
            <option value="parkings">Parkings</option>
            <option value="comunitats">Comunitats</option>
            <option value="oficines">Oficines</option>
        </select><br><br>

        <label for="tipus_permis">Tipus Permís:</label>
        <select id="tipus_permis" name="tipus_permis">
            <option value="baix">Baix</option>
            <option value="mitja">Mitjà</option>
            <option value="alt">Alt</option>
        </select><br><br>

        <button type="submit">Registrar</button>
    </form>
</body>
</html>
