{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="text-center mb-4">
            <h2 class="display-6 mb-3" style="background: linear-gradient(90deg, #8B5CF6, #4FD1C5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                Recuperació de Contrasenya
            </h2>
            <p class="text-muted">Introdueix el teu usuari o email per rebre un codi de recuperació.</p>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-4">
                        <label for="identifier" class="form-label">Usuari o Email</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control" id="identifier" name="identifier" required placeholder="Ex: joan@exemple.com">
                        </div>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-envelope"></i> Enviar email de recuperació
                        </button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('auth.login') }}" class="btn btn-link">
                        <i class="bi bi-arrow-left"></i> Tornar al login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
