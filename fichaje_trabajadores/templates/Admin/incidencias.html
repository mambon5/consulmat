<!-- incidencias.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Incidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container main-container">
        <h2>Registrar Incidencia</h2>
        <form>
            <label for="tipo" class="form-label">Tipo de Incidencia:</label>
            <select id="tipo" class="form-select">
                <option value="vessament">Vessament d'Oli</option>
                <option value="fluorescent">Cambiar Fluorescente</option>
                <option value="inundado">Parking Inundado</option>
                <option value="coche">Coche No Retirado</option>
            </select>
            <label for="descripcion" class="form-label">Descripción:</label>
            <textarea id="descripcion" class="form-control"></textarea>
            <button type="submit" class="btn btn-warning mt-3">Registrar</button>
        </form>
    </div>
</body>
</html>
