{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-success text-white">
            <h3>Registrar primer administrador per {{ empresa.nom }}</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group mb-3">
                    <label for="username">{{ _('Nom d'usuari') }}</label>
                    <input type="text" class="form-control" name="username" required>
                </div>
                <div class="form-group mb-3">
                    <label for="name">{{ _('Nom complet') }}</label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                <div class="form-group mb-3">
                    <label for="email">{{ _('Email') }}</label>
                    <input type="email" class="form-control" name="email" value="{{ prefilled_email if prefilled_email else '' }}" required>
                </div>
                <div class="form-group mb-3">
                    <label for="phone">{{ _('Telèfon') }}</label>
                    <input type="text" class="form-control" name="phone">
                </div>
                <div class="form-group mb-3">
                    <label for="password">{{ _('Contrasenya d’accés (usuari)') }}</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <div class="form-group mb-3">
                    <label for="empresa_password">{{ _('Contrasenya de l’empresa') }}</label>
                    <input type="password" class="form-control" name="empresa_password" required>
                </div>
                <button type="submit" class="btn btn-success">{{ _('Crear administrador') }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
