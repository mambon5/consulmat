{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
            <h2 class="display-6 mb-3"
                style="background: linear-gradient(90deg, #8B5CF6, #4FD1C5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">{{ _('Nova Contrasenya') }}</h2>
            <p class="text-muted">{{ _('Verifica el codi rebut i posa la teva nova contrasenya.') }}</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="POST" id="resetForm">
                    <input type="hidden" name="email" value="{{ email }}">

                    <div class="mb-4">
                        <label for="code" class="form-label">{{ _('Codi d'Activació') }}</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-key"></i>
                            </span>
                            <input type="text" class="form-control" id="code" name="code" required maxlength="6"
                                autocomplete="off" placeholder="{{ _('######') }}">
                            <span class="input-group-text d-none" id="codeSuccess">
                                <i class="bi bi-check-circle-fill text-success"></i>
                            </span>
                            <span class="input-group-text d-none" id="codeError">
                                <i class="bi bi-x-circle-fill text-danger"></i>
                            </span>
                        </div>
                        <div id="codeFeedback" class="small mt-1"></div>
                    </div>

                    <div id="passwordFields" class="d-none">
                        <div class="mb-3">
                            <label for="password" class="form-label">{{ _('Nova Contrasenya') }}</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="password" name="password" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword1">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label">{{ _('Repeteix la Contrasenya') }}</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock-fill"></i>
                                </span>
                                <input type="password" class="form-control" id="confirm_password"
                                    name="confirm_password" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword2">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div id="passwordFeedback" class="small text-danger mt-1 d-none">Les contrasenyes no
                                coincideixen.</div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success" id="submitBtn" disabled>
                                <i class="bi bi-save"></i> Actualitzar Contrasenya
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const codeInput = document.getElementById('code');
    const email = "{{ email }}";
    const passwordFields = document.getElementById('passwordFields');
    const codeSuccess = document.getElementById('codeSuccess');
    const codeError = document.getElementById('codeError');
    const codeFeedback = document.getElementById('codeFeedback');
    const submitBtn = document.getElementById('submitBtn');

    codeInput.addEventListener('input', async function () {
        if (this.value.length === 6) {
            try {
                const res = await fetch('/api/verify-recovery-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, code: this.value })
                });

                const data = await res.json();
                if (res.ok) {
                    codeSuccess.classList.remove('d-none');
                    codeError.classList.add('d-none');
                    codeFeedback.innerText = "Codi verificat!";
                    codeFeedback.className = "small mt-1 text-success";
                    passwordFields.classList.remove('d-none');
                    codeInput.readOnly = true;
                } else {
                    codeError.classList.remove('d-none');
                    codeSuccess.classList.add('d-none');
                    codeFeedback.innerText = "Codi incorrecte.";
                    codeFeedback.className = "small mt-1 text-danger";
                }
            } catch (err) {
                console.error(err);
            }
        } else {
            codeSuccess.classList.add('d-none');
            codeError.classList.add('d-none');
            codeFeedback.innerText = "";
        }
    });

    const pass1 = document.getElementById('password');
    const pass2 = document.getElementById('confirm_password');
    const feedback = document.getElementById('passwordFeedback');

    function validatePasswords() {
        if (pass1.value && pass2.value) {
            if (pass1.value === pass2.value) {
                feedback.classList.add('d-none');
                submitBtn.disabled = false;
            } else {
                feedback.classList.remove('d-none');
                submitBtn.disabled = true;
            }
        } else {
            submitBtn.disabled = true;
        }
    }

    pass1.addEventListener('input', validatePasswords);
    pass2.addEventListener('input', validatePasswords);

    function setupToggle(btnId, passId) {
        document.getElementById(btnId).addEventListener('click', function () {
            const password = document.getElementById(passId);
            const icon = this.querySelector('i');
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });
    }

    setupToggle('togglePassword1', 'password');
    setupToggle('togglePassword2', 'confirm_password');
</script>
{% endblock %}
