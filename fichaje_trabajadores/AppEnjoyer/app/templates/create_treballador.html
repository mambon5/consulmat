{% extends "create_user.html" %}

{% block extra_fields %}
<div class="form-group mb-3">
    <label for="departament">Departament</label>
    <select name="departament" id="departament" class="form-control" required>
        <option value="">Selecciona...</option>
        <option value="parkings" {% if extra_fields and extra_fields.departament=='parkings' %}selected{% endif %}>
            Parkings</option>
        <option value="comunitats" {% if extra_fields and extra_fields.departament=='comunitats' %}selected{% endif %}>
            Comunitats</option>
        <option value="oficines" {% if extra_fields and extra_fields.departament=='oficines' %}selected{% endif %}>
            Oficines</option>
    </select>
</div>

<div class="form-group mb-3">
    <label for="adreca">Adreça</label>
    <input type="text" class="form-control" id="adreca" name="adreca"
        value="{{ extra_fields.adreca if extra_fields and extra_fields.adreca else '' }}">
</div>

<div class="form-group mb-3">
    <label for="ciutat">Ciutat</label>
    <input type="text" class="form-control" id="ciutat" name="ciutat"
        value="{{ extra_fields.ciutat if extra_fields and extra_fields.ciutat else '' }}">
</div>

<div class="form-group mb-3">
    <label for="codi_postal">Codi Postal</label>
    <input type="text" class="form-control" id="codi_postal" name="codi_postal"
        value="{{ extra_fields.codi_postal if extra_fields and extra_fields.codi_postal else '' }}">
</div>

<div class="form-group mb-3">
    <label for="sexe">Sexe</label>
    <select name="sexe" id="sexe" class="form-control">
        <option value="">Selecciona...</option>
        <option value="f" {% if extra_fields and extra_fields.sexe=='f' %}selected{% endif %}>Femení</option>
        <option value="m" {% if extra_fields and extra_fields.sexe=='m' %}selected{% endif %}>Masculí</option>
        <option value="no" {% if extra_fields and extra_fields.sexe=='no' %}selected{% endif %}>No especificat</option>
    </select>
</div>

<div class="form-group mb-3">
    <label for="nacionalitat">Nacionalitat</label>
    <select name="nacionalitat" id="nacionalitat" class="form-control">
        {% for pais in paisos %}
        <option value="{{ pais.name }}" {% if extra_fields and extra_fields.nacionalitat==pais.name %}selected{% endif
            %}>{{ pais.name }}</option>
        {% endfor %}
    </select>
</div>

<div class="form-group mb-3">
    <label for="edat">Edat</label>
    <input type="number" class="form-control" id="edat" name="edat"
        value="{{ extra_fields.edat if extra_fields and extra_fields.edat else '' }}">
</div>

<div class="form-group mb-3">
    <label for="carnet_conduir">Carnet de Conduir</label>
    <select name="carnet_conduir" id="carnet_conduir" class="form-control">
        <option value="">Selecciona...</option>
        <option value="si" {% if extra_fields and extra_fields.carnet_conduir=='si' %}selected{% endif %}>Sí</option>
        <option value="no" {% if extra_fields and extra_fields.carnet_conduir=='no' %}selected{% endif %}>No</option>
    </select>
</div>

<div class="form-group mb-3">
    <label for="vehicle_propi">Vehicle propi</label>
    <select name="vehicle_propi" id="vehicle_propi" class="form-control">
        <option value="">Selecciona...</option>
        <option value="si" {% if extra_fields and extra_fields.vehicle_propi=='si' %}selected{% endif %}>Sí</option>
        <option value="no" {% if extra_fields and extra_fields.vehicle_propi=='no' %}selected{% endif %}>No</option>
    </select>
</div>
{% endblock %}
